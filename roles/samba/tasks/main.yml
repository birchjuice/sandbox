- name: Install samba packages
  package:
    name: samba
    state: present

- name: Deploy samba config
  template:
    src: smb.conf.j2
    dest: /etc/samba/smb.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart samba

- name: Start samba
  service:
    name: smbd
    state: started
    enabled: true

- name: Create node exporter group
  group:
    name: node_exporter
    system: true

- name: Create node exporter user
  user:
    name: node_exporter
    group: node_exporter
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Check if node exporter is installed
  stat:
    path: /usr/local/bin/node_exporter
  register: node_exporter_binary

- name: Install node exporter
  when: not node_exporter_binary.stat.exists
  block:
    - name: Download node exporter archive
      get_url:
        url: https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz
        dest: /tmp/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz
        mode: '0644'

    - name: Extract node exporter archive
      unarchive:
        src: /tmp/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz
        dest: /tmp
        remote_src: true
        creates: /tmp/node_exporter-{{ node_exporter_version }}.linux-amd64

    - name: Deploy node exporter binaries
      copy:
        src: /tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter
        dest: /usr/local/bin/node_exporter
        remote_src: true
        owner: root
        group: root
        mode: '0755'
      notify: Restart node exporter

    - name: Remove temporary node exporter files
      file:
        path: '{{ item }}'
        state: absent
      loop:
        - /tmp/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz
        - /tmp/node_exporter-{{ node_exporter_version }}.linux-amd64

- name: Deploy node exporter systemd service
  template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: '0644'
  notify:
    - Reload systemd
    - Restart node exporter

- name: Start node exporter
  service:
    name: node_exporter
    state: started
    enabled: true

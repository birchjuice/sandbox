- name: Create gitea directory
  file:
    path: /opt/gitea
    state: directory
    mode: '0755'

- name: Create gitea data directory
  file:
    path: /opt/gitea/data
    state: directory
    mode: '0755'

- name: Create mariadb directory
  file:
    path: /opt/gitea/db
    state: directory
    mode: '0755'

- name: Deploy docker compose file
  template:
    src: compose.yml.j2
    dest: /opt/gitea/compose.yml
    owner: root
    group: root
    mode: '0600'
  notify: Restart gitea

- name: Deploy Dockerfile
  template:
    src: Dockerfile.j2
    dest: /opt/gitea/Dockerfile
    owner: root
    group: root
    mode: '0644'
  register: gitea_dockerfile

- name: Deploy LAB Root CA certificate
  copy:
    src: lab-root-ca.crt
    dest: /opt/gitea/lab-root-ca.crt
    owner: root
    group: root
    mode: '0644'
  register: gitea_ca

- name: Build gitea image
  command: docker compose build server
  args:
    chdir: /opt/gitea
  when: gitea_dockerfile.changed or gitea_ca.changed

- name: Start gitea
  command: docker compose up -d
  args:
    chdir: /opt/gitea
  changed_when: false

- name: Wait for gitea
  uri:
    url: http://localhost:{{ gitea_http_port }}
    status_code: 200
  register: gitea_status
  retries: 30
  delay: 2
  until: gitea_status.status == 200

- name: Check if admin user exists
  command: >
    docker exec --user git gitea
    gitea admin user list
  register: gitea_users
  changed_when: false

- name: Create admin user
  command: >
    docker exec --user git gitea
    gitea admin user create
    --username {{ gitea_admin_user }}
    --password {{ gitea_admin_password }}
    --email {{ gitea_admin_email }}
    --admin
  when: gitea_users.stdout.find(gitea_admin_user) == -1
  no_log: true

- name: List gitea authentication sources
  command:
    argv:
      - docker
      - exec
      - --user
      - git
      - gitea
      - gitea
      - admin
      - auth
      - list
  register: gitea_auth_sources
  changed_when: false

- name: Add keycloak authentication source
  command:
    argv:
      - docker
      - exec
      - --user
      - git
      - gitea
      - gitea
      - admin
      - auth
      - add-oauth
      - --name
      - keycloak
      - --provider
      - openidConnect
      - --key
      - gitea
      - --secret
      - '{{ gitea_keycloak_client_secret }}'
      - --auto-discover-url
      - 'https://auth.apps.lab.local/realms/lab/.well-known/openid-configuration'
      - --scopes
      - 'openid profile email'
  when: gitea_auth_sources.stdout.find('keycloak') == -1
  no_log: true

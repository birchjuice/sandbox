- name: Create prometheus group
  group:
    name: prometheus
    system: true

- name: Create prometheus user
  user:
    name: prometheus
    group: prometheus
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Check prometheus version
  command: /usr/local/bin/prometheus --version
  register: prometheus_installed
  changed_when: false
  failed_when: false

- name: Install prometheus
  when: prometheus_installed.rc != 0 or prometheus_installed.stdout.find(prometheus_version) == -1
  block:
    - name: Download prometheus archive
      get_url:
        url: https://github.com/prometheus/prometheus/releases/download/v{{ prometheus_version }}/prometheus-{{ prometheus_version }}.linux-amd64.tar.gz
        dest: /tmp/prometheus-{{ prometheus_version }}.linux-amd64.tar.gz
        mode: '0644'

    - name: Extract prometheus archive
      unarchive:
        src: /tmp/prometheus-{{ prometheus_version }}.linux-amd64.tar.gz
        dest: /tmp
        remote_src: true
        creates: /tmp/prometheus-{{ prometheus_version }}.linux-amd64

    - name: Deploy prometheus binaries
      copy:
        src: /tmp/prometheus-{{ prometheus_version }}.linux-amd64/{{ item }}
        dest: /usr/local/bin/{{ item }}
        remote_src: true
        owner: root
        group: root
        mode: '0755'
      loop:
        - prometheus
        - promtool
      notify: Restart prometheus

    - name: Remove temporary prometheus files
      file:
        path: '{{ item }}'
        state: absent
      loop:
        - /tmp/prometheus-{{ prometheus_version }}.linux-amd64.tar.gz
        - /tmp/prometheus-{{ prometheus_version }}.linux-amd64

- name: Create prometheus directories
  file:
    path: '{{ item.path }}'
    state: directory
    owner: '{{ item.owner }}'
    group: '{{ item.group }}'
    mode: '{{ item.mode }}'
  loop:
    - { path: /etc/prometheus, owner: root, group: root, mode: '0755' }
    - { path: /var/lib/prometheus, owner: prometheus, group: prometheus, mode: '0755' }

- name: Deploy prometheus config
  template:
    src: prometheus.yml.j2
    dest: /etc/prometheus/prometheus.yml
    owner: root
    group: root
    mode: '0644'
  notify: Restart prometheus

- name: Deploy prometheus systemd service
  template:
    src: prometheus.service.j2
    dest: /etc/systemd/system/prometheus.service
    owner: root
    group: root
    mode: '0644'
  notify:
    - Reload systemd
    - Restart prometheus

- name: Start prometheus
  service:
    name: prometheus
    state: started
    enabled: true
